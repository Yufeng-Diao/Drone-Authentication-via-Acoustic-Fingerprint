[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "drone-acoustic-fingerprint"
version = "0.1.0"
description = "Reproducible acoustic drone authentication research"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "toolbox/LICENSE_python_speech_features"]
dependencies = [
  "numpy>=2.5.4,<3",
  "scipy>=1.18.1,<2",
  "scikit-learn>=1.9.1,<2",
  "matplotlib>=3.11.2,<4",
  "joblib>=1.6.0,<2",
  "threadpoolctl>=3.6.0,<4",
]

[project.scripts]
drone-auth = "drone_fingerprint.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[tool.uv]
required-version = "==0.13.0"
# Rebuild local wheels after source edits, not just dependency metadata changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "toolbox/**/*.py" }, { file = "README.md" }, { file = "LICENSE" }, { file = "toolbox/LICENSE_python_speech_features" }]

[tool.hatch.build.targets.wheel]
packages = ["src/drone_fingerprint", "toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
